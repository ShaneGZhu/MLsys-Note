[project]
name = "ray-learn"
version = "0.1.0"
description = "Ray lessons scoped to the Lux orchestration layer"
requires-python = ">=3.11"
dependencies = [
    # [default] 带 dashboard —— 学 L02/L03 时「看见」资源与 bundle 比读日志快得多
